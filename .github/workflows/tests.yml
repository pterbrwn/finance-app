name: Finance application tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned recovery tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes age=1.0.0-1ubuntu0.1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Fast financial checks
        run: npm run test:fast
        env:
          TEST_ARTIFACTS_DIR: ${{ runner.temp }}/finance-test-artifacts
      - name: Storage and HTTP integration checks
        run: npm run test:integration
        env:
          TEST_ARTIFACTS_DIR: ${{ runner.temp }}/finance-test-artifacts
      - name: Encrypted recovery checks
        run: npm run test:recovery
        env:
          TEST_ARTIFACTS_DIR: ${{ runner.temp }}/finance-test-artifacts
      - name: Browser acceptance and all registered cases
        run: npm run test:browser
        env:
          TEST_ARTIFACTS_DIR: ${{ runner.temp }}/finance-test-artifacts
      - name: Immutable release rehearsal
        run: npm run test:release
        env:
          TEST_ARTIFACTS_DIR: ${{ runner.temp }}/finance-test-artifacts
      - name: Retain private synthetic failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-test-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/finance-test-artifacts
          if-no-files-found: ignore
          retention-days: 7
